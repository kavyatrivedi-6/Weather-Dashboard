<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌦️ Weather Dashboard</h1>
        <p class="subtitle">Check the weather anywhere in the world</p>

        <div class="search-box">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
            >
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="error"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="city">City Name</h2>
            <p id="date">Date</p>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <h3 id="condition">Weather Condition</h3>

            <div class="details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </div>

        <p class="footer">Made with HTML, CSS & JavaScript ❤️</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
